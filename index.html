<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Movie & TV Queue</title>

  <style>

    * {

      box-sizing: border-box;

    }

    body {

      margin: 0;

      font-family: Arial, Helvetica, sans-serif;

      background: #f3f5f7;

      color: #1f2937;

    }

    header {

      background: #172554;

      color: white;

      padding: 24px 20px;

      text-align: center;

    }

    header h1 {

      margin: 0 0 6px;

      font-size: 30px;

    }

    header p {

      margin: 0;

      color: #dbeafe;

    }

    .container {

      width: 95%;

      max-width: 900px;

      margin: 24px auto;

    }

    .card {

      background: white;

      border-radius: 14px;

      padding: 22px;

      margin-bottom: 22px;

      box-shadow: 0 3px 12px rgba(0,0,0,0.08);

    }

    .add-section h2,

    .queue-section h2 {

      margin-top: 0;

    }

    .entry-row {

      display: flex;

      gap: 10px;

      flex-wrap: wrap;

    }

    input {

      flex: 1;

      min-width: 230px;

      font-size: 18px;

      padding: 14px;

      border: 1px solid #cbd5e1;

      border-radius: 9px;

    }

    button {

      border: none;

      background: #2563eb;

      color: white;

      padding: 14px 20px;

      border-radius: 9px;

      font-size: 17px;

      cursor: pointer;

    }

    button:hover {

      background: #1d4ed8;

    }

    .queue-info {

      color: #64748b;

      margin-bottom: 18px;

    }

    .movie-card {

      border: 1px solid #e2e8f0;

      border-radius: 12px;

      padding: 18px;

      margin-bottom: 14px;

      background: #ffffff;

    }

    .movie-number {

      display: inline-block;

      background: #172554;

      color: white;

      font-weight: bold;

      border-radius: 50%;

      width: 32px;

      height: 32px;

      text-align: center;

      line-height: 32px;

      margin-right: 8px;

    }

    .movie-title {

      font-size: 22px;

      font-weight: bold;

    }

    .added-by {

      margin-top: 7px;

      color: #64748b;

      font-size: 14px;

    }

    .details {

      margin-top: 13px;

      line-height: 1.7;

    }

    .details strong {

      color: #334155;

    }

    .remove-button {

      background: #dc2626;

      padding: 8px 12px;

      font-size: 14px;

      margin-top: 12px;

    }

    .remove-button:hover {

      background: #b91c1c;

    }

    .show-more-container {

      text-align: center;

      margin-top: 20px;

    }

    #showMore {

      background: #475569;

    }

    #showMore:hover {

      background: #334155;

    }

    .empty-message {

      text-align: center;

      color: #64748b;

      padding: 30px 10px;

      border: 2px dashed #cbd5e1;

      border-radius: 10px;

    }

    footer {

      text-align: center;

      color: #64748b;

      padding: 20px;

      font-size: 14px;

    }

    @media (max-width: 600px) {

      header h1 {

        font-size: 25px;

      }

      button {

        width: 100%;

      }

      input {

        width: 100%;

      }

    }

  </style>

</head>

<body>

<header>

  <h1>🎬 Movie & TV Queue</h1>

  <p>Our shared list — newest additions first</p>

</header>

<div class="container">

  <div class="card add-section">

    <h2>Add a Movie or TV Series</h2>

    <div class="entry-row">

      <input

        id="titleInput"

        type="text"

        placeholder="Enter movie or TV series name"

        autocomplete="off"

      />

      <button onclick="addTitle()">Add to Queue</button>

    </div>

  </div>

  <div class="card queue-section">

    <h2>Our LIFO Queue</h2>

    <div class="queue-info">

      Most recently added titles appear first.

      Showing 5 titles at a time.

    </div>

    <div id="queue"></div>

    <div class="show-more-container">

      <button id="showMore" onclick="showMore()" style="display:none;">

        Show Next 5

      </button>

    </div>

  </div>

</div>

<footer>

  Movie & TV Queue

</footer>

<script>

  const STORAGE_KEY = "movieTvQueue";

  let visibleCount = 5;

  let queue = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];

  function saveQueue() {

    localStorage.setItem(STORAGE_KEY, JSON.stringify(queue));

  }

  function addTitle() {

    const input = document.getElementById("titleInput");

    const title = input.value.trim();

    if (!title) {

      alert("Please enter a movie or TV series name.");

      return;

    }

    const item = {

      id: Date.now(),

      title: title,

      addedDate: new Date().toLocaleString(),

      type: "Movie / TV",

      releaseDate: "Information pending",

      imdb: "Information pending",

      rottenTomatoes: "Information pending",

      cast: "Information pending",

      streaming: "Information pending"

    };

    /*

       LIFO:

       New items are inserted at the beginning

       of the array.

    */

    queue.unshift(item);

    saveQueue();

    visibleCount = 5;

    input.value = "";

    renderQueue();

  }

  function removeTitle(id) {

    const confirmed = confirm(

      "Remove this title from the queue?"

    );

    if (!confirmed) return;

    queue = queue.filter(item => item.id !== id);

    saveQueue();

    renderQueue();

  }

  function showMore() {

    visibleCount += 5;

    renderQueue();

  }

  function renderQueue() {

    const container = document.getElementById("queue");

    const showMoreButton = document.getElementById("showMore");

    container.innerHTML = "";

    if (queue.length === 0) {

      container.innerHTML = `

        <div class="empty-message">

          <strong>The queue is currently empty.</strong>

          <br><br>

          Enter the name of a movie or TV series above

          to add the first title.

        </div>

      `;

      showMoreButton.style.display = "none";

      return;

    }

    const visibleItems = queue.slice(0, visibleCount);

    visibleItems.forEach((item, index) => {

      const card = document.createElement("div");

      card.className = "movie-card";

      card.innerHTML = `

        <div>

          <span class="movie-number">${index + 1}</span>

          <span class="movie-title">${escapeHTML(item.title)}</span>

        </div>

        <div class="added-by">

          Added: ${escapeHTML(item.addedDate)}

        </div>

        <div class="details">

          <div>

            <strong>Type:</strong>

            ${escapeHTML(item.type)}

          </div>

          <div>

            <strong>Release Date:</strong>

            ${escapeHTML(item.releaseDate)}

          </div>

          <div>

            <strong>IMDb Rating:</strong>

            ${escapeHTML(item.imdb)}

          </div>

          <div>

            <strong>Rotten Tomatoes:</strong>

            ${escapeHTML(item.rottenTomatoes)}

          </div>

          <div>

            <strong>Cast:</strong>

            ${escapeHTML(item.cast)}

          </div>

          <div>

            <strong>Streaming:</strong>

            ${escapeHTML(item.streaming)}

          </div>

        </div>

        <button

          class="remove-button"

          onclick="removeTitle(${item.id})">

          Remove

        </button>

      `;

      container.appendChild(card);

    });

    if (visibleCount < queue.length) {

      const remaining = queue.length - visibleCount;

      showMoreButton.style.display = "inline-block";

      showMoreButton.textContent =

        remaining >= 5

          ? "Show Next 5"

          : `Show ${remaining} More`;

    } else {

      showMoreButton.style.display = "none";

    }

  }

  function escapeHTML(value) {

    const div = document.createElement("div");

    div.textContent = value || "";

    return div.innerHTML;

  }

  document

    .getElementById("titleInput")

    .addEventListener("keydown", function(event) {

      if (event.key === "Enter") {

        addTitle();

      }

    });

  renderQueue();

</script>

</body>

</html>
